services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: userbot_hosting
      DATA_DIR: /data
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  app_data:
